name: Backend

on:
  push:
    paths:
      - "apps/backend/**"
      - "content/**"
      - "apps/android/app/src/main/assets/pilot.tsv"
      - "apps/android/app/src/main/assets/frequent-pack.json"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "apps/backend/**"
      - "content/**"
      - "apps/android/app/src/main/assets/pilot.tsv"
      - "apps/android/app/src/main/assets/frequent-pack.json"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run seed -- --dry-run
